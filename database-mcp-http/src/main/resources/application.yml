server:
  # Spring Boot HTTP 服务端口
  port: 8080
  servlet:
    context-path: /database-mcp-server

database-mcp:
  http:
    # MCP over HTTP 的服务地址
    endpoint: /mcp

    # streamable HTTP 会话保活间隔
    keep-alive-interval: 60s

    # 是否启用 MCP API Key 校验
    # 默认关闭，便于内网联调
    api-key-enabled: false

    # 客户端传递 API Key 的请求头
    api-key-header: X-API-Key

    # API Key 签名密钥
    # 只有 api-key-enabled=true 时才会实际参与校验
    api-key-secret: change-me-secret
    api-key-ttl-seconds: 300
    api-key-allowed-clock-skew-seconds: 30

    # 管理后台 API 地址与登录凭据
    # admin-username 为登录用户名，默认 admin
    # admin-password 为初始密码；留空时初始密码就是服务器当天日期，格式 yyyy-MM-dd
    # 首次启动会把初始凭据写入 SQLite，之后请在管理后台“修改密码”中维护
    admin-api-base-path: /admin/api
    admin-username-header: X-Admin-User
    admin-password-header: X-Admin-Password
    admin-username: admin
    admin-password: ""

    # SQLite 配置库存放路径
    # 如果库为空，启动时会先用下面的样例配置初始化
    config-db-path: data/database-mcp-config.db

#日志地址
logging:
  file:
    name: /home/monitor/deployments/mcp-tools/database-mcp-server/logs/mcp-server.log
  level:
    root: info